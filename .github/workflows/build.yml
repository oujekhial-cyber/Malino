name: Build Malino Android

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  android:

    runs-on: ubuntu-22.04

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git \
            unzip \
            zip \
            openjdk-17-jdk

      - name: Install Python build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            buildozer \
            cython \
            qtpip \
            GitPython

      - name: Clone PySide setup
        run: |
          rm -rf "$HOME/pyside-setup"

          git clone \
            --depth 1 \
            --branch 6.8 \
            https://code.qt.io/pyside/pyside-setup \
            "$HOME/pyside-setup"

      - name: Install PySide Android build dependencies
        run: |
          python -m pip install \
            -r "$HOME/pyside-setup/tools/cross_compile_android/requirements.txt"

      - name: Download Android SDK and NDK
        run: |
          python \
            "$HOME/pyside-setup/tools/cross_compile_android/main.py" \
            --download-only \
            --skip-update \
            --auto-accept-license

      - name: Download Android PySide wheels
        run: |
          rm -rf android-wheels
          mkdir -p android-wheels

          qtpip download \
            PySide6 \
            --android \
            --arch aarch64 \
            -d android-wheels

          echo "Downloaded wheels:"
          find android-wheels -maxdepth 1 -type f -name "*.whl" -print

      - name: Locate Android wheels
        run: |
          PSWHEEL="$(find "$GITHUB_WORKSPACE/android-wheels" \
            -maxdepth 1 \
            -type f \
            -iname 'PySide6-*.whl' \
            | head -n 1)"

          SWWHEEL="$(find "$GITHUB_WORKSPACE/android-wheels" \
            -maxdepth 1 \
            -type f \
            -iname 'shiboken6-*.whl' \
            | head -n 1)"

          if [ -z "$PSWHEEL" ]; then
            echo "ERROR: PySide6 Android wheel was not downloaded."
            find "$GITHUB_WORKSPACE/android-wheels" -maxdepth 2 -type f -print
            exit 1
          fi

          if [ -z "$SWWHEEL" ]; then
            echo "ERROR: shiboken6 Android wheel was not downloaded."
            find "$GITHUB_WORKSPACE/android-wheels" -maxdepth 2 -type f -print
            exit 1
          fi

          echo "PSWHEEL=$PSWHEEL" >> "$GITHUB_ENV"
          echo "SWWHEEL=$SWWHEEL" >> "$GITHUB_ENV"

          echo "PySide wheel:"
          echo "$PSWHEEL"

          echo "Shiboken wheel:"
          echo "$SWWHEEL"

      - name: Validate QML
        run: |
          echo "Checking QML files..."

          find qml -type f -name "*.qml" -print

          if grep -RInE '(^|[^:])\;[[:space:]]*(property|id:|anchors|color:|text:|Layout|Button|Text|Item|Rectangle|RowLayout|ColumnLayout)' qml; then
            echo "ERROR: Suspicious QML semicolon syntax detected."
            exit 1
          fi

      - name: Build APK
        run: |
          pyside6-android-deploy \
            --name Malino \
            --wheel-pyside="$PSWHEEL" \
            --wheel-shiboken="$SWWHEEL" \
            --config-file pysidedeploy.spec \
            --force

      - name: Find Android artifacts
        run: |
          echo "Searching for APK/AAB..."

          find . \
            -type f \
            \( -name "*.apk" -o -name "*.aab" \) \
            -print

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4

        with:
          name: malino-android

          path: |
            **/*.apk
            **/*.aab

          if-no-files-found: error
