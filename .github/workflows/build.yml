name: Build KharjYar Android

on:
  push:
    branches:
      - main
      - 'arena/**'
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[skip ci]')"

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Unit tests
        id: unittests
        continue-on-error: true
        run: |
          set -o pipefail
          ./gradlew :app:testDebugUnitTest --stacktrace --console=plain 2>&1 | tee unittest.log

      - name: Report unit-test failures
        if: steps.unittests.outcome != 'success'
        run: |
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          found = False
          for path in glob.glob('app/build/test-results/testDebugUnitTest/*.xml'):
              root = ET.parse(path).getroot()
              for case in root.findall('.//testcase'):
                  failure = case.find('failure')
                  error = case.find('error')
                  problem = failure if failure is not None else error
                  if problem is not None:
                      found = True
                      message = (problem.get('message') or problem.text or 'failed').splitlines()[0]
                      print(f"::error title=Unit test failed::{case.get('classname')}.{case.get('name')}: {message}")
          if not found:
              print('::error title=Unit tests failed::No parsed test result; inspect unittest.log artifact')
          PY

      - name: Assemble debug APK
        id: assemble
        continue-on-error: true
        run: |
          set -o pipefail
          ./gradlew :app:assembleDebug --stacktrace --console=plain 2>&1 | tee assemble.log

      # کلید امضا فقط وقتی موجود است که مالک مخزن آن را به‌صورت Secret اضافه کرده باشد.
      # اگر نبود، نسخه انتشار با کلید debug امضا می‌شود تا همیشه یک فایل قابل نصب وجود داشته باشد.
      - name: Restore signing key
        id: signing
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/kharjyar-release.p12"
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "کلید امضای اختصاصی بازیابی شد"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "Secret کلید تعریف نشده — نسخه انتشار با کلید debug امضا می‌شود"
          fi

      - name: Assemble release APK
        id: release
        continue-on-error: true
        env:
          KEYSTORE_FILE: ${{ steps.signing.outputs.available == 'true' && format('{0}/kharjyar-release.p12', runner.temp) || '' }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -o pipefail
          ./gradlew :app:assembleRelease --stacktrace --console=plain 2>&1 | tee release.log

      # هواشناسی به اینترنت و موقعیت تقریبی نیاز دارد، اما موقعیت دقیق همچنان ممنوع است.
      - name: Privacy check on merged manifest
        id: privacy
        continue-on-error: true
        run: |
          set -o pipefail
          FOUND=0
          for M in $(find app/build/intermediates -path '*merged_manifest*' -name 'AndroidManifest.xml'); do
            if grep -Eq 'android.permission.ACCESS_(FINE|COARSE)_LOCATION' "$M"; then
              echo "::error::مجوز موقعیت مکانی در مانیفست ادغام‌شده پیدا شد: $M"
              FOUND=1
            fi
          done
          if [ "$FOUND" = "1" ]; then exit 1; fi
          echo "مانیفست هیچ مجوز موقعیت مکانی ندارد"

      - name: Lint debug
        id: lint
        continue-on-error: true
        run: |
          set -o pipefail
          ./gradlew :app:lintDebug --console=plain 2>&1 | tee lint.log

      - name: Collect outputs
        if: always()
        run: |
          mkdir -p dist
          rm -rf dist/*
          {
            echo "# گزارش Build و تست (CI)"
            echo ""
            echo "- commit: ${GITHUB_SHA}"
            echo "- تاریخ: $(date -u '+%Y-%m-%d %H:%M UTC')"
            echo "- unit tests: ${{ steps.unittests.outcome }}"
            echo "- assembleDebug: ${{ steps.assemble.outcome }}"
            echo "- بررسی حریم خصوصی (مانیفست ادغام‌شده): ${{ steps.privacy.outcome }}"
            echo "- lintDebug: ${{ steps.lint.outcome }}"
            echo "- assembleRelease: ${{ steps.release.outcome }}"
            echo ""
            echo '## خلاصه تست‌های واحد'
            echo '```'
            python3 scripts/test_summary.py
            echo '```'
          } > dist/build-report.md
          tail -n 5000 unittest.log > dist/unittest-tail.log || true
          tail -n 5000 assemble.log > dist/assemble-tail.log || true
          # خطاهای کامپایل کاتلین/جاوا جدا ذخیره می‌شوند (دنباله لاگ معمولاً فقط stacktrace گریدل است)
          grep -hE "^(e:|w: .*error|.*error:)|FAILURE:|Execution failed for task|^Caused by:" unittest.log assemble.log 2>/dev/null \
            | head -n 200 > dist/compile-errors.log || true
          if [ -s dist/compile-errors.log ]; then
            while IFS= read -r line; do
              safe=${line//'%'/'%25'}; safe=${safe//$'\r'/'%0D'}; safe=${safe//$'\n'/'%0A'}
              echo "::error title=Gradle diagnostic::$safe"
            done < <(head -n 20 dist/compile-errors.log)
          fi
          tail -n 60 lint.log > dist/lint-tail.log || true
          tail -n 5000 release.log > dist/release-tail.log || true
          if [ -f app/build/outputs/apk/debug/app-debug.apk ]; then
            cp app/build/outputs/apk/debug/app-debug.apk dist/KharjYar-debug.apk
            (cd dist && sha256sum KharjYar-debug.apk > KharjYar-debug.apk.sha256)
          fi
          # نسخه انتشار: کوچک‌تر، سریع‌تر و امضاشده
          # نام فایل خروجی بسته به امضا فرق می‌کند (app-release یا app-release-unsigned)
          REL=$(ls app/build/outputs/apk/release/*.apk 2>/dev/null | head -1)
          echo "خروجی انتشار: ${REL:-یافت نشد}"
          ls -la app/build/outputs/apk/release/ 2>/dev/null || true
          if [ -n "$REL" ] && [ -f "$REL" ]; then
            cp "$REL" dist/KharjYar-release.apk
            (cd dist && sha256sum KharjYar-release.apk > KharjYar-release.apk.sha256)
            echo "" >> dist/build-report.md
            echo "## نسخه انتشار" >> dist/build-report.md
            echo "- حجم: $(du -h "$REL" | cut -f1)" >> dist/build-report.md
            echo "- کلید اختصاصی: ${{ steps.signing.outputs.available }}" >> dist/build-report.md
            APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -1)
            if [ -n "$APKSIGNER" ]; then
              if "$APKSIGNER" verify --print-certs "$REL" > dist/release-signature.txt 2>&1; then
                echo "- امضا: معتبر" >> dist/build-report.md
              else
                echo "- امضا: نامعتبر — APK قابل نصب نیست" >> dist/build-report.md
                echo "::error::نسخه انتشار امضای معتبر ندارد"
                cat dist/release-signature.txt
                exit 1
              fi
            fi
          fi
          if [ -d app/build/reports/lint-results-debug.txt ] || [ -f app/build/reports/lint-results-debug.txt ]; then
            cp app/build/reports/lint-results-debug.txt dist/ || true
          fi
          if [ -d app/schemas ]; then
            mkdir -p dist/schemas && cp -r app/schemas/. dist/schemas/ || true
          fi

      # خروجی باینری فقط به‌صورت Artifact منتشر می‌شود. commit کردن APK از داخل همان
      # Workflow باعث push race و قرمز شدن اجرای موفق می‌شد.

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kharjyar-outputs
          path: |
            dist/
            app/build/reports/
          if-no-files-found: warn

      - name: Fail job if build failed
        if: steps.assemble.outcome != 'success' || steps.unittests.outcome != 'success' || steps.privacy.outcome != 'success'
        run: |
          echo "build or tests failed"; exit 1
