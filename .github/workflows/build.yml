name: Build Malino Android

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:

  android:

    runs-on: ubuntu-22.04

    steps:

      # ---------------------------------------------------
      # Checkout
      # ---------------------------------------------------

      - name: Checkout
        uses: actions/checkout@v4

      # ---------------------------------------------------
      # Python
      # ---------------------------------------------------

      - name: Setup Python
        uses: actions/setup-python@v5

        with:
          python-version: "3.11"

      # ---------------------------------------------------
      # System packages
      # ---------------------------------------------------

      - name: Install system dependencies
        run: |

          sudo apt-get update

          sudo apt-get install -y \
            git \
            wget \
            curl \
            unzip \
            zip \
            openjdk-17-jdk

      # ---------------------------------------------------
      # Python dependencies
      # ---------------------------------------------------

      - name: Install PySide6 deployment tools
        run: |

          python -m pip install --upgrade pip

          python -m pip install \
            "PySide6==6.8.2" \
            "shiboken6==6.8.2" \
            buildozer \
            cython \
            qtpip \
            GitPython

          echo ""
          echo "Installed packages:"
          python -m pip list

          echo ""
          echo "Checking deployment command:"

          which pyside6-android-deploy

          pyside6-android-deploy --help

      # ---------------------------------------------------
      # Clone Qt for Python setup
      # ---------------------------------------------------

      - name: Clone PySide setup
        run: |

          rm -rf "$HOME/pyside-setup"

          git clone \
            --depth 1 \
            --branch 6.8 \
            https://code.qt.io/pyside/pyside-setup \
            "$HOME/pyside-setup"

      # ---------------------------------------------------
      # Install cross compile dependencies
      # ---------------------------------------------------

      - name: Install Qt Android build dependencies
        run: |

          python -m pip install \
            -r "$HOME/pyside-setup/requirements.txt"

          python -m pip install \
            -r "$HOME/pyside-setup/tools/cross_compile_android/requirements.txt"

      # ---------------------------------------------------
      # Download Android SDK / NDK
      # ---------------------------------------------------

      - name: Download Android SDK and NDK
        run: |

          python \
            "$HOME/pyside-setup/tools/cross_compile_android/main.py" \
            --download-only \
            --skip-update \
            --auto-accept-license

      # ---------------------------------------------------
      # Download Android PySide6 wheel
      # ---------------------------------------------------

      - name: Download Android PySide6 wheels
        run: |

          mkdir -p "$GITHUB_WORKSPACE/android-wheels"

          cd "$GITHUB_WORKSPACE/android-wheels"

          echo "Downloading PySide6 Android wheel..."

          wget -nv \
            "https://download.qt.io/official_releases/QtForPython/pyside6/PySide6-6.8.2.1-6.8.2-cp311-cp311-android_aarch64.whl" \
            -O \
            "PySide6-6.8.2.1-6.8.2-cp311-cp311-android_aarch64.whl"

          echo ""
          echo "Downloading Shiboken6 Android wheel..."

          wget -nv \
            "https://download.qt.io/official_releases/QtForPython/shiboken6/shiboken6-6.8.2.1-6.8.2-cp311-cp311-android_aarch64.whl" \
            -O \
            "shiboken6-6.8.2.1-6.8.2-cp311-cp311-android_aarch64.whl"

          echo ""
          echo "Downloaded Android wheels:"
          ls -lh

      # ---------------------------------------------------
      # Verify wheels
      # ---------------------------------------------------

      - name: Verify Android wheels
        run: |

          PSWHEEL="$GITHUB_WORKSPACE/android-wheels/PySide6-6.8.2.1-6.8.2-cp311-cp311-android_aarch64.whl"

          SWWHEEL="$GITHUB_WORKSPACE/android-wheels/shiboken6-6.8.2.1-6.8.2-cp311-cp311-android_aarch64.whl"

          echo "PySide6:"
          echo "$PSWHEEL"

          echo ""

          echo "Shiboken6:"
          echo "$SWWHEEL"

          echo ""

          test -f "$PSWHEEL"
          test -f "$SWWHEEL"

          echo "✅ Android wheels verified."

          echo "PSWHEEL=$PSWHEEL" >> "$GITHUB_ENV"
          echo "SWWHEEL=$SWWHEEL" >> "$GITHUB_ENV"

      # ---------------------------------------------------
      # Validate project
      # ---------------------------------------------------

      - name: Validate project
        run: |

          echo "Checking main.py..."

          test -f main.py

          echo "Checking controller..."

          test -f core/controller.py

          echo "Checking database..."

          test -f core/db.py

          echo "Checking parser..."

          test -f core/parser.py

          echo "Checking QML..."

          find qml \
            -type f \
            -name "*.qml" \
            -print

          echo ""

          echo "Checking deployment configuration..."

          test -f pysidedeploy.spec

          echo ""
          echo "✅ Project validation passed."

      # ---------------------------------------------------
      # Deploy
      # ---------------------------------------------------

      - name: Build Malino Android
        run: |

          echo "=============================================="
          echo "       STARTING ANDROID DEPLOYMENT"
          echo "=============================================="

          echo ""

          echo "Deployment executable:"

          which pyside6-android-deploy

          echo ""

          pyside6-android-deploy \
            --name "Malino" \
            --wheel-pyside="$PSWHEEL" \
            --wheel-shiboken="$SWWHEEL" \
            --config-file="$GITHUB_WORKSPACE/pysidedeploy.spec" \
            --force

      # ---------------------------------------------------
      # Find APK
      # ---------------------------------------------------

      - name: Find Android artifacts
        run: |

          echo "Searching for APK/AAB..."

          find "$GITHUB_WORKSPACE" \
            -type f \
            \( \
              -name "*.apk" \
              -o \
              -name "*.aab" \
            \) \
            -print

      # ---------------------------------------------------
      # Upload APK
      # ---------------------------------------------------

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4

        with:

          name: Malino-Android

          path: |
            **/*.apk
            **/*.aab

          if-no-files-found: error
