name: Build Malino Android

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git \
            wget \
            curl \
            unzip \
            zip \
            openjdk-17-jdk

      - name: Install PySide6 deployment tools
        run: |
          python -m pip install --upgrade pip

          python -m pip install \
            "PySide6==6.8.2" \
            "shiboken6==6.8.2" \
            buildozer \
            cython \
            qtpip \
            GitPython

          which pyside6-android-deploy

      - name: Clone PySide setup
        run: |
          rm -rf "$HOME/pyside-setup"

          git clone \
            --depth 1 \
            --branch 6.8 \
            https://code.qt.io/pyside/pyside-setup \
            "$HOME/pyside-setup"

      - name: Install Python build requirements
        run: |
          python -m pip install \
            -r "$HOME/pyside-setup/requirements.txt"

          python -m pip install \
            -r "$HOME/pyside-setup/tools/cross_compile_android/requirements.txt"

      - name: Download Android SDK
        run: |
          python "$HOME/pyside-setup/tools/cross_compile_android/main.py" \
            --download-only \
            --skip-update \
            --auto-accept-license

      - name: Install Android NDK explicitly
        shell: bash
        run: |

          echo "=============================================="
          echo "       INSTALLING ANDROID NDK"
          echo "=============================================="

          SDK="$HOME/.pyside6_android_deploy/android-sdk"

          echo "SDK:"
          echo "$SDK"

          if [ ! -d "$SDK" ]; then
            echo "ERROR: Android SDK does not exist."
            exit 1
          fi

          export ANDROID_HOME="$SDK"
          export ANDROID_SDK_ROOT="$SDK"

          SDKMANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER=$(find "$SDK" \
              -type f \
              -name sdkmanager \
              | head -1)
          fi

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager not found."

            find "$SDK" \
              -type f \
              -name sdkmanager \
              -print || true

            exit 1
          fi

          echo "sdkmanager:"
          echo "$SDKMANAGER"

          chmod +x "$SDKMANAGER" || true

          echo
          echo "Accepting licenses..."

          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true

          echo
          echo "Installing required Android packages..."

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;35.0.0" \
            "ndk;26.1.10909125"

          echo
          echo "=============================================="
          echo "       INSTALLED NDK DIRECTORIES"
          echo "=============================================="

          find "$SDK/ndk" \
            -mindepth 1 \
            -maxdepth 1 \
            -type d \
            -print \
            2>/dev/null || true

          NDK="$SDK/ndk/26.1.10909125"

          if [ ! -d "$NDK" ]; then
            echo "ERROR: NDK installation failed."
            exit 1
          fi

          LLVM="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readobj"

          if [ ! -f "$LLVM" ]; then
            echo "ERROR: llvm-readobj not found."

            find "$NDK" \
              -type f \
              -name "llvm-readobj*" \
              -print || true

            exit 1
          fi

          echo
          echo "NDK:"
          echo "$NDK"

          echo
          echo "llvm-readobj:"
          "$LLVM" --version

          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$NDK" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$NDK" >> "$GITHUB_ENV"

      - name: Download Android PySide6 wheels
        run: |
          mkdir -p "$GITHUB_WORKSPACE/android-wheels"

          cd "$GITHUB_WORKSPACE/android-wheels"

          wget -nv \
            "https://download.qt.io/official_releases/QtForPython/pyside6/PySide6-6.8.2.1-6.8.2-cp311-cp311-android_aarch64.whl" \
            -O "PySide6-6.8.2.1-6.8.2-cp311-cp311-android_aarch64.whl"

          wget -nv \
            "https://download.qt.io/official_releases/QtForPython/shiboken6/shiboken6-6.8.2.1-6.8.2-cp311-cp311-android_aarch64.whl" \
            -O "shiboken6-6.8.2.1-6.8.2-cp311-cp311-android_aarch64.whl"

          ls -lh

      - name: Verify wheels
        run: |

          PSWHEEL="$GITHUB_WORKSPACE/android-wheels/PySide6-6.8.2.1-6.8.2-cp311-cp311-android_aarch64.whl"

          SWWHEEL="$GITHUB_WORKSPACE/android-wheels/shiboken6-6.8.2.1-6.8.2-cp311-cp311-android_aarch64.whl"

          test -f "$PSWHEEL"
          test -f "$SWWHEEL"

          echo "PSWHEEL=$PSWHEEL" >> "$GITHUB_ENV"
          echo "SWWHEEL=$SWWHEEL" >> "$GITHUB_ENV"

      - name: Validate project
        run: |

          echo "=============================================="
          echo "       VALIDATING MALINO"
          echo "=============================================="

          test -f main.py
          test -f pysidedeploy.spec

          echo "QML files:"
          find qml -type f -name "*.qml" -print

      - name: Build Malino Android
        shell: bash
        run: |

          echo "=============================================="
          echo "       STARTING ANDROID DEPLOYMENT"
          echo "=============================================="

          echo "SDK:"
          echo "$ANDROID_SDK_ROOT"

          echo
          echo "NDK:"
          echo "$ANDROID_NDK_ROOT"

          echo
          echo "Checking NDK..."

          test -f \
            "$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readobj"

          "$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readobj" \
            --version

          echo
          echo "Running PySide6 Android deploy..."

          pyside6-android-deploy \
            --name "Malino" \
            --wheel-pyside="$PSWHEEL" \
            --wheel-shiboken="$SWWHEEL" \
            --ndk-path="$ANDROID_NDK_ROOT" \
            --sdk-path="$ANDROID_SDK_ROOT" \
            --config-file="$GITHUB_WORKSPACE/pysidedeploy.spec" \
            --force

      - name: Find APK
        run: |

          echo "=============================================="
          echo "       SEARCHING FOR APK"
          echo "=============================================="

          find "$GITHUB_WORKSPACE" \
            -type f \
            \( -name "*.apk" -o -name "*.aab" \) \
            -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Malino-Android
          path: |
            **/*.apk
            **/*.aab
          if-no-files-found: error
