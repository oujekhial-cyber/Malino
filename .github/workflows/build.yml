name: Build Malino Android

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-22.04

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            git \
            wget \
            curl \
            unzip \
            zip \
            openjdk-17-jdk

      - name: Install PySide6 tools
        run: |
          python -m pip install --upgrade pip

          python -m pip install \
            "PySide6==6.8.2" \
            "shiboken6==6.8.2" \
            buildozer \
            cython \
            qtpip \
            GitPython

          echo
          echo "PySide6 deploy:"
          which pyside6-android-deploy

      - name: Clone PySide setup
        run: |
          rm -rf "$HOME/pyside-setup"

          git clone \
            --depth 1 \
            --branch 6.8 \
            https://code.qt.io/pyside/pyside-setup \
            "$HOME/pyside-setup"

      - name: Install Python requirements
        run: |
          python -m pip install \
            -r "$HOME/pyside-setup/requirements.txt"

          python -m pip install \
            -r "$HOME/pyside-setup/tools/cross_compile_android/requirements.txt"

      - name: Download PySide Android SDK base
        run: |
          python "$HOME/pyside-setup/tools/cross_compile_android/main.py" \
            --download-only \
            --skip-update \
            --auto-accept-license

      - name: Install official Android command line tools
        shell: bash
        run: |

          echo "=============================================="
          echo " INSTALLING OFFICIAL ANDROID COMMAND LINE TOOLS"
          echo "=============================================="

          SDK="$HOME/.pyside6_android_deploy/android-sdk"

          echo
          echo "Selecting Java 17..."

          JAVA17=""

          for J in \
            /usr/lib/jvm/java-17-openjdk-amd64 \
            /usr/lib/jvm/java-17-openjdk; do

            if [ -x "$J/bin/java" ]; then
              JAVA17="$J"
              break
            fi

          done

          if [ -z "$JAVA17" ]; then
            echo "ERROR: Java 17 was not found."
            ls -la /usr/lib/jvm/ || true
            exit 1
          fi

          export JAVA_HOME="$JAVA17"
          export PATH="$JAVA_HOME/bin:$PATH"

          echo
          echo "JAVA_HOME:"
          echo "$JAVA_HOME"

          echo
          echo "Java version:"
          java -version

          echo
          echo "Downloading official command line tools..."

          mkdir -p "$SDK"

          CMD_DIR="$SDK/cmdline-tools"

          rm -rf "$CMD_DIR"

          mkdir -p "$CMD_DIR"

          cd /tmp

          rm -rf cmdline-tools android-cmdline-tools.zip

          wget -q \
            "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip" \
            -O android-cmdline-tools.zip

          unzip -q android-cmdline-tools.zip

          mkdir -p "$CMD_DIR/latest"

          cp -R cmdline-tools/* "$CMD_DIR/latest/"

          rm -rf cmdline-tools
          rm -f android-cmdline-tools.zip

          chmod +x "$CMD_DIR/latest/bin/sdkmanager"

          echo
          echo "sdkmanager:"
          ls -lh "$CMD_DIR/latest/bin/sdkmanager"

          echo
          echo "sdkmanager version:"

          "$CMD_DIR/latest/bin/sdkmanager" \
            --version

          echo
          echo "Java 17 confirmed."

          echo "JAVA_HOME=$JAVA_HOME" >> "$GITHUB_ENV"
          echo "$JAVA_HOME/bin" >> "$GITHUB_PATH"

      - name: Install Android SDK and NDK
        shell: bash
        run: |

          export JAVA_HOME="/usr/lib/jvm/java-17-openjdk-amd64"
          export PATH="$JAVA_HOME/bin:$PATH"

          echo "=============================================="
          echo "       INSTALLING ANDROID SDK + NDK"
          echo "=============================================="

          SDK="$HOME/.pyside6_android_deploy/android-sdk"

          SDKMANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"

          export ANDROID_HOME="$SDK"
          export ANDROID_SDK_ROOT="$SDK"

          chmod +x "$SDKMANAGER"

          echo
          echo "SDK:"
          echo "$SDK"

          echo
          echo "SDKMANAGER:"
          echo "$SDKMANAGER"

          echo
          echo "Accepting Android licenses..."

          yes | "$SDKMANAGER" \
            --sdk_root="$SDK" \
            --licenses \
            >/dev/null 2>&1 || true

          echo
          echo "Installing platform tools..."

          "$SDKMANAGER" \
            --sdk_root="$SDK" \
            "platform-tools"

          echo
          echo "Installing Android platform..."

          "$SDKMANAGER" \
            --sdk_root="$SDK" \
            "platforms;android-34"

          echo
          echo "Installing build tools..."

          "$SDKMANAGER" \
            --sdk_root="$SDK" \
            "build-tools;35.0.0"

          echo
          echo "Installing NDK..."

          "$SDKMANAGER" \
            --sdk_root="$SDK" \
            "ndk;26.1.10909125"

          echo
          echo "=============================================="
          echo "       VERIFYING NDK"
          echo "=============================================="

          NDK="$SDK/ndk/26.1.10909125"

          if [ ! -d "$NDK" ]; then
            echo
            echo "ERROR:"
            echo "NDK directory does not exist:"
            echo "$NDK"
            echo
            echo "Installed NDK directories:"
            find "$SDK" \
              -type d \
              -path "*/ndk/*" \
              -maxdepth 5 \
              -print || true
            exit 1
          fi

          LLVM="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readobj"

          if [ ! -f "$LLVM" ]; then
            echo
            echo "ERROR:"
            echo "llvm-readobj not found."

            find "$NDK" \
              -type f \
              -name "llvm-readobj*" \
              -print || true

            exit 1
          fi

          echo
          echo "NDK FOUND:"
          echo "$NDK"

          echo
          echo "llvm-readobj:"
          "$LLVM" --version

          echo
          echo "NDK contents:"
          ls -lah "$NDK" | head -50

          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$NDK" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$NDK" >> "$GITHUB_ENV"

      - name: Download PySide6 Android wheels
        shell: bash
        run: |

          mkdir -p "$GITHUB_WORKSPACE/android-wheels"

          cd "$GITHUB_WORKSPACE/android-wheels"

          wget -nv \
            "https://download.qt.io/official_releases/QtForPython/pyside6/PySide6-6.8.2.1-6.8.2-cp311-cp311-android_aarch64.whl" \
            -O "PySide6-6.8.2.1-6.8.2-cp311-cp311-android_aarch64.whl"

          wget -nv \
            "https://download.qt.io/official_releases/QtForPython/shiboken6/shiboken6-6.8.2.1-6.8.2-cp311-cp311-android_aarch64.whl" \
            -O "shiboken6-6.8.2.1-6.8.2-cp311-cp311-android_aarch64.whl"

          ls -lh

      - name: Verify PySide wheels
        run: |

          PSWHEEL="$GITHUB_WORKSPACE/android-wheels/PySide6-6.8.2.1-6.8.2-cp311-cp311-android_aarch64.whl"

          SWWHEEL="$GITHUB_WORKSPACE/android-wheels/shiboken6-6.8.2.1-6.8.2-cp311-cp311-android_aarch64.whl"

          test -f "$PSWHEEL"
          test -f "$SWWHEEL"

          echo "PSWHEEL=$PSWHEEL" >> "$GITHUB_ENV"
          echo "SWWHEEL=$SWWHEEL" >> "$GITHUB_ENV"

      - name: Validate Malino
        shell: bash
        run: |

          echo "=============================================="
          echo "          VALIDATING MALINO"
          echo "=============================================="

          test -f main.py
          test -f pysidedeploy.spec

          echo
          echo "Project files:"
          find . \
            -maxdepth 3 \
            -type f \
            | sort

      - name: Build Malino
        shell: bash
        run: |

          echo
          echo "=============================================="
          echo "       STARTING ANDROID DEPLOYMENT"
          echo "=============================================="

          echo
          echo "Deployment executable:"
          which pyside6-android-deploy

          echo
          echo "SDK:"
          echo "$ANDROID_SDK_ROOT"

          echo
          echo "NDK:"
          echo "$ANDROID_NDK_ROOT"

          echo
          echo "Checking llvm-readobj..."

          "$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readobj" \
            --version

          echo
          echo "=============================================="
          echo "       RUNNING PYSIDE6 DEPLOY"
          echo "=============================================="

          pyside6-android-deploy \
            --name "Malino" \
            --wheel-pyside="$PSWHEEL" \
            --wheel-shiboken="$SWWHEEL" \
            --ndk-path="$ANDROID_NDK_ROOT" \
            --sdk-path="$ANDROID_SDK_ROOT" \
            --config-file="$GITHUB_WORKSPACE/pysidedeploy.spec" \
            --force

      - name: Search APK
        shell: bash
        run: |

          echo "=============================================="
          echo "             APK SEARCH"
          echo "=============================================="

          find "$GITHUB_WORKSPACE" \
            -type f \
            \( -name "*.apk" -o -name "*.aab" \) \
            -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Malino-Android
          path: |
            **/*.apk
            **/*.aab
          if-no-files-found: error
