name: Build Malino Android

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  android:

    runs-on: ubuntu-22.04

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            git \
            wget \
            curl \
            unzip \
            zip \
            openjdk-17-jdk

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip

          python -m pip install \
            buildozer \
            cython \
            qtpip \
            GitPython

      - name: Clone PySide setup
        run: |
          rm -rf "$HOME/pyside-setup"

          git clone \
            --depth 1 \
            --branch 6.8 \
            https://code.qt.io/pyside/pyside-setup \
            "$HOME/pyside-setup"

      - name: Install Qt Android build dependencies
        run: |
          python -m pip install \
            -r "$HOME/pyside-setup/requirements.txt"

          python -m pip install \
            -r "$HOME/pyside-setup/tools/cross_compile_android/requirements.txt"

      - name: Download Android SDK and NDK
        run: |
          python \
            "$HOME/pyside-setup/tools/cross_compile_android/main.py" \
            --download-only \
            --skip-update \
            --auto-accept-license

      - name: Download official PySide6 Android wheels
        run: |

          mkdir -p "$GITHUB_WORKSPACE/android-wheels"

          cd "$GITHUB_WORKSPACE/android-wheels"

          echo "Downloading official Qt PySide6 Android wheel..."

          wget -nv \
            "https://download.qt.io/official_releases/QtForPython/pyside6/PySide6-6.8.2.1-6.8.2-cp311-cp311-android_aarch64.whl" \
            -O \
            "PySide6-6.8.2.1-6.8.2-cp311-cp311-android_aarch64.whl"

          echo "Downloading official Qt Shiboken6 Android wheel..."

          wget -nv \
            "https://download.qt.io/official_releases/QtForPython/shiboken6/shiboken6-6.8.2.1-6.8.2-cp311-cp311-android_aarch64.whl" \
            -O \
            "shiboken6-6.8.2.1-6.8.2-cp311-cp311-android_aarch64.whl"

          echo ""
          echo "Downloaded files:"
          ls -lh

      - name: Verify Android wheels
        run: |

          PSWHEEL="$GITHUB_WORKSPACE/android-wheels/PySide6-6.8.2.1-6.8.2-cp311-cp311-android_aarch64.whl"

          SWWHEEL="$GITHUB_WORKSPACE/android-wheels/shiboken6-6.8.2.1-6.8.2-cp311-cp311-android_aarch64.whl"

          echo "PySide6:"
          echo "$PSWHEEL"

          echo "Shiboken6:"
          echo "$SWWHEEL"

          if [ ! -f "$PSWHEEL" ]; then
            echo ""
            echo "❌ PySide6 wheel not found."
            exit 1
          fi

          if [ ! -f "$SWWHEEL" ]; then
            echo ""
            echo "❌ Shiboken6 wheel not found."
            exit 1
          fi

          echo ""
          echo "✅ Both Android wheels exist."

          echo "PSWHEEL=$PSWHEEL" >> "$GITHUB_ENV"
          echo "SWWHEEL=$SWWHEEL" >> "$GITHUB_ENV"

      - name: Validate project
        run: |

          echo "Checking main.py..."

          test -f main.py

          echo "Checking QML..."

          find qml \
            -type f \
            -name "*.qml" \
            -print

          echo ""
          echo "Checking deployment spec..."

          test -f pysidedeploy.spec

          echo ""
          echo "✅ Project validation passed."

      - name: Build Android APK
        run: |

          echo "=============================================="
          echo "Starting PySide6 Android deployment"
          echo "=============================================="

          echo ""
          echo "PySide6 wheel:"
          echo "$PSWHEEL"

          echo ""
          echo "Shiboken6 wheel:"
          echo "$SWWHEEL"

          echo ""

          pyside6-android-deploy \
            --name "Malino" \
            --wheel-pyside="$PSWHEEL" \
            --wheel-shiboken="$SWWHEEL" \
            --config-file="$GITHUB_WORKSPACE/pysidedeploy.spec" \
            --force

      - name: Find APK
        run: |

          echo "Searching for APK/AAB..."

          find "$GITHUB_WORKSPACE" \
            -type f \
            \( \
              -name "*.apk" \
              -o \
              -name "*.aab" \
            \) \
            -print

      - name: Upload APK
        uses: actions/upload-artifact@v4

        with:
          name: Malino-Android

          path: |
            **/*.apk
            **/*.aab

          if-no-files-found: error
