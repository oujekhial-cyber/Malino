name: Build Malino Android

on:
  push:
    branches:
      - main
      - 'arena/**'
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-22.04

    permissions:
      contents: write
      issues: write

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            git \
            wget \
            curl \
            unzip \
            zip \
            openjdk-17-jdk

      - name: Select Java 17
        run: |
          JAVA17="/usr/lib/jvm/java-17-openjdk-amd64"
          test -x "$JAVA17/bin/java"
          echo "JAVA_HOME=$JAVA17" >> "$GITHUB_ENV"
          echo "$JAVA17/bin" >> "$GITHUB_PATH"

      - name: Install build tools (pinned versions)
        run: |
          python -m pip install --upgrade pip

          # buildozer 1.5.0 + cython<3 match python-for-android v2024.01.21,
          # which is pinned inside build_android.sh.
          # packaging/tqdm/jinja2/pkginfo are imported by the Qt deploy tool
          # (android_utilities.py, android_helper.py, android_config.py) but
          # declared by no package; appdirs/colorama/sh<2/toml/build are the
          # requirements of python-for-android v2024.01.21 itself.
          python -m pip install \
            "PySide6==6.8.2" \
            "shiboken6==6.8.2" \
            "buildozer==1.5.0" \
            "cython<3" \
            "packaging" \
            "tqdm" \
            "jinja2" \
            "pkginfo" \
            "appdirs" \
            "colorama>=0.3.3" \
            "toml" \
            "build" \
            "sh>=1.10,<2.0" \
            "setuptools" \
            "GitPython"

          # Fail fast with a clear message if any of the undeclared deploy
          # tool dependencies is still missing.
          python -c "import packaging, tqdm, jinja2, pkginfo; print('deploy deps OK')"

          which pyside6-android-deploy
          pyside6-android-deploy --help >/dev/null

      - name: Clone PySide setup
        run: |
          rm -rf "$HOME/pyside-setup"

          git clone \
            --depth 1 \
            --branch 6.8 \
            https://code.qt.io/pyside/pyside-setup \
            "$HOME/pyside-setup"

      - name: Install Python requirements
        run: |
          python -m pip install \
            -r "$HOME/pyside-setup/requirements.txt"

          python -m pip install \
            -r "$HOME/pyside-setup/tools/cross_compile_android/requirements.txt"

      - name: Download PySide Android SDK base
        run: |
          python "$HOME/pyside-setup/tools/cross_compile_android/main.py" \
            --download-only \
            --skip-update \
            --auto-accept-license

      - name: Install Android SDK and NDK
        shell: bash
        run: |
          SDK="$HOME/.pyside6_android_deploy/android-sdk"

          mkdir -p "$SDK"
          SDKMANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -x "$SDKMANAGER" ]; then
            cd /tmp
            rm -rf cmdline-tools android-cmdline-tools.zip

            wget -q \
              "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip" \
              -O android-cmdline-tools.zip

            unzip -q android-cmdline-tools.zip
            mkdir -p "$SDK/cmdline-tools/latest"
            cp -R cmdline-tools/* "$SDK/cmdline-tools/latest/"
            rm -rf cmdline-tools android-cmdline-tools.zip
          fi

          chmod +x "$SDKMANAGER"
          "$SDKMANAGER" --version

          export ANDROID_HOME="$SDK"
          export ANDROID_SDK_ROOT="$SDK"

          yes | "$SDKMANAGER" --sdk_root="$SDK" --licenses >/dev/null 2>&1 || true

          "$SDKMANAGER" --sdk_root="$SDK" "platform-tools"
          "$SDKMANAGER" --sdk_root="$SDK" "platforms;android-34"
          "$SDKMANAGER" --sdk_root="$SDK" "build-tools;35.0.0"
          "$SDKMANAGER" --sdk_root="$SDK" "ndk;26.1.10909125"

          NDK="$SDK/ndk/26.1.10909125"
          test -d "$NDK"
          test -f "$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readobj"

          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$NDK" >> "$GITHUB_ENV"

      - name: Download PySide6 Android wheels
        shell: bash
        run: |
          # aarch64 = the APK for real phones; x86_64 = the APK that runs
          # natively on the CI emulator used by the emulator-test job.
          mkdir -p "$GITHUB_WORKSPACE/android-wheels"
          cd "$GITHUB_WORKSPACE/android-wheels"

          wget -nv \
            "https://download.qt.io/official_releases/QtForPython/pyside6/PySide6-6.8.2.1-6.8.2-cp311-cp311-android_aarch64.whl" \
            -O "PySide6-6.8.2.1-6.8.2-cp311-cp311-android_aarch64.whl"

          wget -nv \
            "https://download.qt.io/official_releases/QtForPython/shiboken6/shiboken6-6.8.2.1-6.8.2-cp311-cp311-android_aarch64.whl" \
            -O "shiboken6-6.8.2.1-6.8.2-cp311-cp311-android_aarch64.whl"

          wget -nv \
            "https://download.qt.io/official_releases/QtForPython/pyside6/PySide6-6.8.2.1-6.8.2-cp311-cp311-android_x86_64.whl" \
            -O "PySide6-6.8.2.1-6.8.2-cp311-cp311-android_x86_64.whl"

          wget -nv \
            "https://download.qt.io/official_releases/QtForPython/shiboken6/shiboken6-6.8.2.1-6.8.2-cp311-cp311-android_x86_64.whl" \
            -O "shiboken6-6.8.2.1-6.8.2-cp311-cp311-android_x86_64.whl"

          ls -lh

      - name: Build Malino
        shell: bash
        env:
          PSWHEEL: ${{ github.workspace }}/android-wheels/PySide6-6.8.2.1-6.8.2-cp311-cp311-android_aarch64.whl
          SWWHEEL: ${{ github.workspace }}/android-wheels/shiboken6-6.8.2.1-6.8.2-cp311-cp311-android_aarch64.whl
        run: |
          set -o pipefail
          bash build_android.sh 2>&1 | tee build_log.txt

      - name: Build Malino (x86_64, for the emulator test)
        # Best effort: if the x86_64 build fails the emulator-test job falls
        # back to the arm64 APK (the API 34 x86_64 image can translate ARM).
        continue-on-error: true
        shell: bash
        env:
          ARCH: x86_64
          ANDROID_SDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}
          ANDROID_NDK_ROOT: ${{ env.ANDROID_NDK_ROOT }}
        run: |
          set -o pipefail
          bash build_android.sh 2>&1 | tee build_x86_64.log

      - name: Report failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          RUNID: ${{ github.run_id }}
        shell: bash
        run: |
          {
            echo "Build Malino failed — run $RUNID (attempt ${{ github.run_attempt }})"
            echo "Commit: $SHA"
            echo
            echo "== phase/step summary (whole log) =="
            grep -nE "^==>|patch-p4a|Cloning into|Detected old|Task :.*FAILED|BUILD (SUCCESSFUL|FAILED)" \
              build_log.txt 2>/dev/null | tail -80 || true
            echo
            echo "== log tail (last 30k) =="
            echo '```'
            tail -c 30000 build_log.txt 2>/dev/null || echo "(no build_log.txt)"
            echo '```'
          } > failure_body.md

          # full log in <=30k chunks as commit comments (readable via
          # api.github.com even where the log endpoints are not)
          rm -f logchunk-*
          split -b 30000 -d -a 2 build_log.txt logchunk- 2>/dev/null || true
          i=0
          for f in logchunk-*; do
            [ -f "$f" ] || continue
            {
              echo "Build log part $i — run $RUNID (commit $SHA)"
              echo '```'
              cat "$f"
              echo '```'
            } > chunkbody.md
            gh api --method POST "repos/$REPO/commits/$SHA/comments" \
              -F body=@"chunkbody.md" >/dev/null 2>&1 || true
            i=$((i+1))
            [ "$i" -ge 6 ] && break
          done

          gh api --method POST "repos/$REPO/commits/$SHA/comments" \
            -F body=@"failure_body.md" > comment_result.json 2>&1 || true
          head -c 400 comment_result.json || true

          gh issue create \
            --repo "$REPO" \
            --title "CI build log (run $RUNID)" \
            --body-file failure_body.md > issue_result.txt 2>&1 || true
          head -c 400 issue_result.txt || true

      - name: Verify APK contents
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          RUNID: ${{ github.run_id }}
        shell: bash
        run: |
          APKS="$(find "$GITHUB_WORKSPACE" -type f -name '*.apk')"
          if [ -z "$APKS" ]; then
            echo "ERROR: no APK produced"
            exit 1
          fi
          echo "$APKS"
          rc_total=0
          for APK in $APKS; do
            echo
            echo "Verifying $APK"
            echo "== APK contents (lib/ and assets/) =="
            unzip -l "$APK" | grep -E "lib/|assets/" | head -120 || true

            python3 scripts_verify_apk.py "$APK" \
              "$ANDROID_SDK_ROOT/build-tools/35.0.0/aapt" | tee verify_result.txt
            rc=${PIPESTATUS[0]}
            if [ "$rc" -ne 0 ]; then
              rc_total=1
              {
                echo "Verify APK contents failed for $APK — run $RUNID (commit $SHA)"
                echo
                echo "== verifier output =="
                echo '```'
                cat verify_result.txt
                echo '```'
                echo
                echo "== APK listing (lib/ + assets/) =="
                echo '```'
                unzip -l "$APK" | grep -E "lib/|assets/" | head -120 || true
                echo '```'
                echo
                echo "== manifest (aapt dump) =="
                echo '```'
                "$ANDROID_SDK_ROOT/build-tools/35.0.0/aapt" dump xmltree "$APK" AndroidManifest.xml | head -80 || true
                echo '```'
              } > verify_body.md
              gh api --method POST "repos/$REPO/commits/$SHA/comments" \
                -F body=@"verify_body.md" >/dev/null 2>&1 || true
            fi
          done
          exit "$rc_total"

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Malino-Android
          path: |
            **/*.apk
            **/*.aab
          if-no-files-found: warn

      - name: Report failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          RUNID: ${{ github.run_id }}
        shell: bash
        run: |
          {
            echo "Build failed — run $RUNID (attempt ${{ github.run_attempt }})"
            echo "Commit: $SHA"
            echo
            echo "== phase/step summary (whole log) =="
            grep -nE "^==>|patch-p4a|Cloning into|Detected old|Task :.*FAILED|BUILD (SUCCESSFUL|FAILED)" \
              build_log.txt 2>/dev/null | tail -80 || true
            echo
            echo "== log tail (last 30k) =="
            echo '```'
            tail -c 30000 build_log.txt 2>/dev/null || echo "(no build_log.txt)"
            echo '```'
          } > failure_body.md

          # full log in <=30k chunks as commit comments (readable via
          # api.github.com even where the log endpoints are not)
          rm -f logchunk-*
          split -b 30000 -d -a 2 build_log.txt logchunk- 2>/dev/null || true
          i=0
          for f in logchunk-*; do
            [ -f "$f" ] || continue
            {
              echo "Build log part $i — run $RUNID (commit $SHA)"
              echo '```'
              cat "$f"
              echo '```'
            } > chunkbody.md
            gh api --method POST "repos/$REPO/commits/$SHA/comments" \
              -F body=@"chunkbody.md" >/dev/null 2>&1 || true
            i=$((i+1))
            [ "$i" -ge 6 ] && break
          done

          gh api --method POST "repos/$REPO/commits/$SHA/comments" \
            -F body=@"failure_body.md" > comment_result.json 2>&1 || true
          head -c 400 comment_result.json || true

  # ---------------------------------------------------------------------------
  # Boot an Android 14 (API 34) emulator on the runner, install the built APK,
  # launch Malino and keep watching its process.  If the app dies instantly
  # (the exact bug reported from a real Android 14/15 phone) this job goes red
  # and posts the logcat crash section as a commit comment - so we get the real
  # crash stack without needing adb on the user's computer.
  # ---------------------------------------------------------------------------
  emulator-test:
    runs-on: ubuntu-22.04
    needs: android
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK (emulator)
        shell: bash
        run: |
          SDK="$HOME/.android-sdk"
          mkdir -p "$SDK/cmdline-tools"
          cd /tmp
          rm -rf cmdline-tools clt.zip
          wget -q "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip" -O clt.zip
          unzip -q clt.zip
          mkdir -p "$SDK/cmdline-tools/latest"
          cp -R cmdline-tools/* "$SDK/cmdline-tools/latest/"
          rm -rf cmdline-tools clt.zip

          SDKMANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"
          chmod +x "$SDKMANAGER"
          yes | "$SDKMANAGER" --sdk_root="$SDK" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" --sdk_root="$SDK" \
            "platform-tools" \
            "emulator" \
            "build-tools;35.0.0" \
            "system-images;android-34;google_apis;x86_64" >/dev/null

          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"

          # Hosted runners expose /dev/kvm but the current user may not have
          # permission to open it. Without this rule the emulator process exits
          # before adb can ever see a device.
          # chmod is immediate and reliable on the ephemeral runner; no udev
          # event needs to be retriggered after /dev/kvm already exists.
          sudo chmod 666 /dev/kvm
          ls -l /dev/kvm
          test -r /dev/kvm && test -w /dev/kvm

      - name: Download built APKs
        uses: actions/download-artifact@v4
        with:
          name: Malino-Android
          path: apks

      - name: Select test APK
        shell: bash
        run: |
          find apks -type f -name '*.apk' -printf '%p (%s bytes)\n'
          # GitHub runs bash with `-e -o pipefail`; grep returning 1 when no
          # filename contains the architecture must not abort before fallback.
          APK="$(find apks -type f -name '*.apk' | grep -E 'x86_64' | head -n 1 || true)"
          if [ -z "$APK" ]; then
            APK="$(find apks -type f -name '*.apk' | head -n 1)"
          fi
          test -n "$APK"
          echo "TEST_APK=$APK" >> "$GITHUB_ENV"
          echo "Testing $APK"

      - name: Read package name from APK
        shell: bash
        run: |
          AAPT="$ANDROID_SDK_ROOT/build-tools/35.0.0/aapt"
          "$AAPT" dump badging "$TEST_APK" | tee badging.txt
          PACKAGE="$(sed -n "s/^package: name='\([^']*\)'.*/\1/p" badging.txt | head -n 1)"
          test -n "$PACKAGE"
          echo "PACKAGE=$PACKAGE" >> "$GITHUB_ENV"
          echo "Package: $PACKAGE"

      - name: Create and boot emulator (API 34 = Android 14)
        shell: bash
        run: |
          AVDMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/avdmanager"
          EMULATOR="$ANDROID_SDK_ROOT/emulator/emulator"
          "$AVDMANAGER" create avd -n malino -k "system-images;android-34;google_apis;x86_64" -d pixel_5 --force
          start_emulator() {
            "$EMULATOR" -avd malino -no-window -no-audio -no-boot-anim \
              -gpu swiftshader_indirect -no-snapshot -no-metrics -no-splash \
              -memory 2048 -camera-back none -camera-front none "$@" \
              >> emulator_boot.log 2>&1 &
            EMULATOR_PID=$!
          }

          # Prefer KVM, then fall back to software acceleration. Some hosted
          # runner pools expose /dev/kvm but cannot actually initialize it.
          start_emulator -accel auto
          if ! timeout 120 adb wait-for-device; then
            echo "KVM emulator did not register with adb; retrying without KVM" | tee -a emulator_boot.log
            kill "$EMULATOR_PID" 2>/dev/null || true
            adb kill-server || true
            start_emulator -accel off
            timeout 300 adb wait-for-device || {
              cat emulator_boot.log
              exit 1
            }
          fi
          timeout 600 bash -c 'while [ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d "\r")" != "1" ]; do sleep 5; done'
          adb shell getprop ro.build.version.release
          adb shell getprop ro.product.cpu.abilist

      - name: Install APK
        run: adb install -r -g "$TEST_APK"

      - name: Launch Malino and watch the process
        id: watch
        shell: bash
        run: |
          set +e
          adb logcat -c
          adb shell monkey -p "$PACKAGE" -c android.intent.category.LAUNCHER 1

          # Wait for the app process to appear (Qt + Python startup takes a while)
          PID1=""
          for i in $(seq 1 30); do
            sleep 3
            PID1="$(adb shell pidof "$PACKAGE" | tr -d '\r' | awk '{print $1}')"
            [ -n "$PID1" ] && break
          done

          # Then check it is STILL alive 30 seconds later (instant crashes
          # sometimes leave a process up for a couple of seconds)
          sleep 30
          PID2="$(adb shell pidof "$PACKAGE" | tr -d '\r' | awk '{print $1}')"

          adb exec-out screencap -p > emulator_screen.png || true
          adb logcat -d > logcat_full.txt
          adb logcat -d -b crash > logcat_crash.txt
          adb shell "dumpsys window | grep -E 'mCurrentFocus|mFocusedApp'" > window_focus.txt || true

          echo "pid_start=$PID1 pid_after_30s=$PID2"
          cat window_focus.txt || true
          echo "--- crash buffer ---"
          cat logcat_crash.txt || true

          DEAD=0
          [ -z "$PID2" ] && DEAD=1
          grep -qF "$PACKAGE" logcat_crash.txt && DEAD=1

          echo "PACKAGE=$PACKAGE" >> "$GITHUB_ENV"
          echo "DEAD=$DEAD" >> "$GITHUB_ENV"

      - name: Test result
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          RUNID: ${{ github.run_id }}
        run: |
          PID_FINAL="$(adb shell pidof "$PACKAGE" | tr -d '\r' || true)"
          FOCUS="$(tr -d '\r' < window_focus.txt 2>/dev/null | head -2 || true)"
          CRASH_LINES="$(wc -l < logcat_crash.txt 2>/dev/null || echo '?')"
          APK_NAME="$(basename "$TEST_APK" 2>/dev/null || echo '?')"

          {
            echo "## Emulator test (Android 14 / API 34, x86_64)"
            echo
            echo "- APK: $APK_NAME"
            echo "- package: $PACKAGE"
            echo "- pid after 30s: ${PID_FINAL:-(empty)}"
            echo "- focus: ${FOCUS:-(empty)}"
            echo "- crash buffer lines: $CRASH_LINES"
            echo
            if [ "${DEAD:-1}" = "0" ]; then
              echo "RESULT: PASSED - app started and stayed alive for 30+ seconds"
            else
              echo "RESULT: FAILED - app died"
              echo
              echo "## crash buffer"
              echo '```'
              head -c 20000 logcat_crash.txt 2>/dev/null
              echo '```'
              echo
              echo "## logcat excerpts (Malino / AndroidRuntime / python)"
              echo '```'
              grep -E "AndroidRuntime|FATAL|SIGSEGV|SIGABRT|has died|Force finishing|python|Malino|Qt" logcat_full.txt 2>/dev/null | tail -n 400 | head -c 20000
              echo '```'
            fi
          } > emulator_body.md
          gh api --method POST "repos/$REPO/commits/$SHA/comments" \
            -F body=@"emulator_body.md" >/dev/null 2>&1 || true
          head -c 400 emulator_body.md || true
          if [ "${DEAD:-1}" != "0" ]; then exit 1; fi

      - name: Upload emulator artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Malino-Emulator-Test
          path: |
            logcat_full.txt
            logcat_crash.txt
            emulator_screen.png
            window_focus.txt
            emulator_boot.log
            badging.txt
          if-no-files-found: warn
