name: Build Malino Android

on:
  push:
    branches:
      - main
      - 'arena/**'
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-22.04

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            git \
            wget \
            curl \
            unzip \
            zip \
            openjdk-17-jdk

      - name: Select Java 17
        run: |
          JAVA17="/usr/lib/jvm/java-17-openjdk-amd64"
          test -x "$JAVA17/bin/java"
          echo "JAVA_HOME=$JAVA17" >> "$GITHUB_ENV"
          echo "$JAVA17/bin" >> "$GITHUB_PATH"

      - name: Install build tools (pinned versions)
        run: |
          python -m pip install --upgrade pip

          # buildozer 1.5.0 + cython<3 match python-for-android v2024.01.21,
          # which is pinned inside build_android.sh.
          # packaging/tqdm/jinja2/pkginfo are imported by the Qt deploy tool
          # (android_utilities.py, android_helper.py, android_config.py) but
          # declared by no package; appdirs/colorama/sh<2/toml/build are the
          # requirements of python-for-android v2024.01.21 itself.
          python -m pip install \
            "PySide6==6.8.2" \
            "shiboken6==6.8.2" \
            "buildozer==1.5.0" \
            "cython<3" \
            "packaging" \
            "tqdm" \
            "jinja2" \
            "pkginfo" \
            "appdirs" \
            "colorama>=0.3.3" \
            "toml" \
            "build" \
            "sh>=1.10,<2.0" \
            "setuptools" \
            "GitPython"

          # Fail fast with a clear message if any of the undeclared deploy
          # tool dependencies is still missing.
          python -c "import packaging, tqdm, jinja2, pkginfo; print('deploy deps OK')"

          which pyside6-android-deploy
          pyside6-android-deploy --help >/dev/null

      - name: Clone PySide setup
        run: |
          rm -rf "$HOME/pyside-setup"

          git clone \
            --depth 1 \
            --branch 6.8 \
            https://code.qt.io/pyside/pyside-setup \
            "$HOME/pyside-setup"

      - name: Install Python requirements
        run: |
          python -m pip install \
            -r "$HOME/pyside-setup/requirements.txt"

          python -m pip install \
            -r "$HOME/pyside-setup/tools/cross_compile_android/requirements.txt"

      - name: Download PySide Android SDK base
        run: |
          python "$HOME/pyside-setup/tools/cross_compile_android/main.py" \
            --download-only \
            --skip-update \
            --auto-accept-license

      - name: Install Android SDK and NDK
        shell: bash
        run: |
          SDK="$HOME/.pyside6_android_deploy/android-sdk"

          mkdir -p "$SDK"
          SDKMANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -x "$SDKMANAGER" ]; then
            cd /tmp
            rm -rf cmdline-tools android-cmdline-tools.zip

            wget -q \
              "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip" \
              -O android-cmdline-tools.zip

            unzip -q android-cmdline-tools.zip
            mkdir -p "$SDK/cmdline-tools/latest"
            cp -R cmdline-tools/* "$SDK/cmdline-tools/latest/"
            rm -rf cmdline-tools android-cmdline-tools.zip
          fi

          chmod +x "$SDKMANAGER"
          "$SDKMANAGER" --version

          export ANDROID_HOME="$SDK"
          export ANDROID_SDK_ROOT="$SDK"

          yes | "$SDKMANAGER" --sdk_root="$SDK" --licenses >/dev/null 2>&1 || true

          "$SDKMANAGER" --sdk_root="$SDK" "platform-tools"
          "$SDKMANAGER" --sdk_root="$SDK" "platforms;android-34"
          "$SDKMANAGER" --sdk_root="$SDK" "build-tools;35.0.0"
          "$SDKMANAGER" --sdk_root="$SDK" "ndk;26.1.10909125"

          NDK="$SDK/ndk/26.1.10909125"
          test -d "$NDK"
          test -f "$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readobj"

          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$NDK" >> "$GITHUB_ENV"

      - name: Download PySide6 Android wheels
        shell: bash
        run: |
          mkdir -p "$GITHUB_WORKSPACE/android-wheels"
          cd "$GITHUB_WORKSPACE/android-wheels"

          wget -nv \
            "https://download.qt.io/official_releases/QtForPython/pyside6/PySide6-6.8.2.1-6.8.2-cp311-cp311-android_aarch64.whl" \
            -O "PySide6-6.8.2.1-6.8.2-cp311-cp311-android_aarch64.whl"

          wget -nv \
            "https://download.qt.io/official_releases/QtForPython/shiboken6/shiboken6-6.8.2.1-6.8.2-cp311-cp311-android_aarch64.whl" \
            -O "shiboken6-6.8.2.1-6.8.2-cp311-cp311-android_aarch64.whl"

          ls -lh

      - name: Build Malino
        shell: bash
        env:
          PSWHEEL: ${{ github.workspace }}/android-wheels/PySide6-6.8.2.1-6.8.2-cp311-cp311-android_aarch64.whl
          SWWHEEL: ${{ github.workspace }}/android-wheels/shiboken6-6.8.2.1-6.8.2-cp311-cp311-android_aarch64.whl
        run: |
          bash build_android.sh

      - name: Verify APK contents
        shell: bash
        run: |
          set -e

          APK="$(find "$GITHUB_WORKSPACE" -type f -name '*.apk' | head -n 1)"
          if [ -z "$APK" ]; then
            echo "ERROR: no APK produced"
            exit 1
          fi
          echo "Verifying $APK"

          python3 scripts_verify_apk.py \
            "$APK" \
            "$ANDROID_SDK_ROOT/build-tools/35.0.0/aapt"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Malino-Android
          path: |
            **/*.apk
            **/*.aab
          if-no-files-found: error
