name: Android unit tests only
on:
  workflow_dispatch:
  push:
    branches:
      - arena/dd2a5ba2-malino
permissions:
  contents: read
jobs:
  test:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[tests only]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v3
      - name: Verify trash database queries
        run: python3 scripts/test_obligation_trash_sql.py
      - name: Run unit tests (no APK)
        run: |
          set -o pipefail
          ./gradlew :app:testDebugUnitTest --stacktrace --console=plain 2>&1 | tee unittest.log
      - name: Publish failure diagnostics
        if: failure()
        run: |
          python3 - <<'PYCODE'
          import glob, re, xml.etree.ElementTree as ET
          lines = open('unittest.log', errors='replace').read().splitlines()
          matches = [line for line in lines if re.search(r'(^e: |error:|FAILURE:|Execution failed for task|^Caused by:| FAILED)', line)]
          for line in matches[:35]:
              print('::error title=Test diagnostic::' + line.replace('%','%25').replace('\r','%0D').replace('\n','%0A'))
          for path in glob.glob('app/build/test-results/testDebugUnitTest/*.xml'):
              for case in ET.parse(path).getroot().findall('.//testcase'):
                  failure = case.find('failure')
                  if failure is not None:
                      message = (failure.get('message') or failure.text or 'failed').splitlines()[0]
                      print('::error title=Unit test failed::' + case.get('classname','') + '.' + case.get('name','') + ': ' + message.replace('%','%25'))
          PYCODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-test-results
          path: app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: ignore
